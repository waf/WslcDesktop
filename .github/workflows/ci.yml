name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # to create releases
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test --solution WslcDesktop.slnx -c Release

      - name: Publish (NativeAOT, win-x64)
        shell: pwsh
        run: ./build/publish.ps1 -Runtime win-x64

      - uses: actions/upload-artifact@v5
        with:
          name: WslcDesktop-win-x64
          path: artifacts/publish/win-x64/WslcDesktop.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} artifacts/publish/win-x64/WslcDesktop.exe --title "WSLC Desktop ${{ github.ref_name }}" --generate-notes
